<style>

.sp{height:44vh;pointer-events:none}

.chip{position:fixed;z-index:3;display:none;transform:translate(-50%,-140%);white-space:nowrap;font-size:.8rem;padding:5px 9px;border-radius:99px;background:rgba(17,25,54,.88);border:1px solid var(--acc);cursor:pointer}
.zones{grid-template-columns:repeat(4,1fr)}.zones button{font-size:.85rem;padding:10px 2px}

select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}

#sub span{opacity:.4;transition:opacity .15s}#sub span.hot{opacity:1;color:#fff}
#dock .row{justify-content:center;margin:4px 0}
#tb{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:linear-gradient(rgba(5,8,22,.92),transparent)}

.gh{display:flex;gap:10px;align-items:center;padding:10px 12px}.gh b{flex:1}.gh span{font-size:.8rem;color:var(--acc)}
.gb{padding:0 12px 28px;max-width:760px;margin:auto}#gm canvas{width:100%;background:#050816;border-radius:12px;display:block;touch-action:none}
.ctl{display:flex;gap:8px;margin:10px 0}.ctl button{flex:1;padding:16px 4px;font-size:.95rem;user-select:none;-webkit-user-select:none;touch-action:none}
#fade{position:fixed;inset:0;background:#000;z-index:6;opacity:0;pointer-events:none;transition:opacity .35s}

#cap{position:fixed;left:0;right:0;top:42%;z-index:4;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s;letter-spacing:.2em;text-transform:uppercase;font-size:.85rem;color:#cfe0ff;text-shadow:0 0 12px #5a8cff}
</style></head><body><main id="app"></main>

D.forEach(o=>{o.R=o.R||["Built and launched","Journey to "+o.z,"Arrival","Mission work","Last contact","Where I am today"]});

function truth(o){const t=TK[o.id];return `<div class=card><b>${t?(t.s?"🟡 Truth Check: checked against news sources":"✅ Truth Check: key facts verified"):"⚠️ Truth Check: not verified yet"}</b><p>${t?t.n:"These facts come from the project team's notes and are not yet checked against NASA sources. Check NASA mission pages before presenting."}</p>${t?t.l.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener" style="color:var(--acc)">${x[0]} ↗</a>`).join("<br>"):""}</div>`}
const SB=window.EOS_SUPABASE||{},lsg=k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])),sbh={apikey:SB.key,Authorization:"Bearer "+SB.key,"Content-Type":"application/json"};
function board(){gm.innerHTML=`<div class=gh><button onclick="hub()">←</button><b>🏫 Class Leaderboard</b><span id=gxp></span></div><div class=gb><div class=card>${SB.url?`<p><small>Share your class code with classmates. Only a nickname and your XP are stored.</small></p><div class=row><input id=cc placeholder="Class code, e.g. 9B-SPACE" value="${esc(lsg("eos_cc"))}" style="flex:1;min-width:0;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0b1230;color:var(--ink)"><input id=nn placeholder="Nickname" value="${esc(lsg("eos_nn"))}" style="flex:1;min-width:0;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0b1230;color:var(--ink)"></div><div class=row><button onclick="bsave()">Submit my XP (${SV.xp})</button><button onclick="bload()">Refresh</button></div><div id=bl></div>`:`<b>Needs a backend</b><p>The class leaderboard runs in the GitHub Pages build with a free Supabase project. Steps are in the README.</p>`}</div></div>`;gxp();if(SB.url&&lsg("eos_cc"))bload()}
async function bload(){const c=($("#cc").value||"").trim().toUpperCase();if(!c)return;$("#bl").textContent="Loading…";try{const r=await fetch(SB.url+"/rest/v1/scores?class_code=eq."+encodeURIComponent(c)+"&select=nick,xp&order=xp.desc&limit=20",{headers:sbh});if(!r.ok)throw new Error(r.status);const a=await r.json();$("#bl").innerHTML=a.length?a.map((x,i)=>`<p>${["🥇","🥈","🥉"][i]||(i+1)+"."} <b>${esc(x.nick)}</b> · ⭐ ${x.xp}</p>`).join(""):"No scores yet. Be the first!"}catch(e){$("#bl").textContent="Could not load: "+e.message}}
async function bsave(){const c=$("#cc").value.trim().toUpperCase(),n=$("#nn").value.trim().slice(0,20);if(!c||!n){$("#bl").textContent="Enter a class code and a nickname.";return}try{localStorage.setItem("eos_cc",c);localStorage.setItem("eos_nn",n)}catch(e){}try{const r=await fetch(SB.url+"/rest/v1/scores?on_conflict=class_code,nick",{method:"POST",headers:{...sbh,Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({class_code:c,nick:n,xp:SV.xp,badges:Object.keys(SV.b).length})});if(!r.ok)throw new Error(r.status);bload()}catch(e){$("#bl").textContent="Could not save: "+e.message}}
zone="Earth";
home();
